name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK; just make sure the
      # platform this project compiles against is present.
      - name: Install SDK packages
        run: |
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OmniADB-Host-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 正式包：用固定金鑰簽章，指紋必須是 A61C312F…A85B，否則直接紅燈。
  #
  # 為什麼要另開一個 job：PR（尤其 fork 來的）拿不到 secrets，這個 job 只在
  # push 到 main 或手動觸發時跑，避免 PR 因為缺 secret 而假紅燈。
  #
  # 需要的 4 個 secrets（Settings → Secrets and variables → Actions）：
  #   ANDROID_KEYSTORE_BASE64     keys/omniadb-host.jks 的 base64（單行）
  #   ANDROID_KEYSTORE_PASSWORD   store 密碼
  #   ANDROID_KEY_ALIAS           omniadb-host
  #   ANDROID_KEY_PASSWORD        key 密碼
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK packages
        run: |
          SDKMGR="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"

      # 缺 secret 時要「明確失敗」，不能默默退回 debug 金鑰 ——
      # 那種包簽章不對，傳上 Release 之後所有人都升不了級。
      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，正式包不建。請先設定 4 個 signing secrets。"
            exit 1
          fi

      - name: Write signing material
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          # storeFile 相對 rootProject，所以放 repo 根目錄就好
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PW"
          } > keystore.properties

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: |
          APK="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee certs.txt
          # 指紋寫死在這裡：換金鑰就得改這一行，等於強迫自己記得換
          grep -qi "a61c312f80e54917d31c5170f19d84e5f4d9a55d2b32c2e18fe218686df7a85b" certs.txt \
            || { echo "::error::簽章指紋不符（不是 omniadb-host 那把），拒絕發佈"; exit 1; }

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: OmniADB-Host-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks keystore.properties certs.txt
